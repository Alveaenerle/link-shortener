version: '3.8'

services:
  db:
    image: postgres
    container_name: my-postgres
    environment:
      POSTGRES_USER: dominik
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./short-postgre-db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  frontend:
    build:
      context: ./short-front
      args:
        REACT_APP_API_URL: https://yapyap.pl
        REACT_APP_SREVR_DOMAIN: https://yapyap.pl/
    depends_on:
      - backend
  
  backend:
    build:
      context: ./short-back
    environment:
      DB_SOCKET: db:5432
    depends_on:
      - db 
  nginx:
    build:
      context: ./nginx
    container_name: nginx-proxy
    ports:
      - "6000:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
